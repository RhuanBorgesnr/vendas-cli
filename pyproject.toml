[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas-cli"
version = "0.1.0"
description = "CLI para gerar relatórios de vendas a partir de arquivos CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "mypy>=1"]

[project.scripts]
vendas-cli = "vendas_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
